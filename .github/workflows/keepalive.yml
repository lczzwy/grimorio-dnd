name: Manter o Supabase acordado

# O plano grátis do Supabase pausa o projeto depois de ~7 dias sem uso.
# Duas consultas leves por semana (segunda e quinta) mantêm o banco ativo.
# Se falhar, o GitHub manda um e-mail para o dono do repositório.
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          # chave publicável: é a mesma que já vai no site, não é segredo
          SUPABASE_URL: https://lnvrptqcjcmvsmeprkfk.supabase.co
          SUPABASE_KEY: sb_publishable_HN9cHvf4pyr2euRV5hkBBA_tStDi1z8
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}') && break
            echo "tentativa $i falhou, esperando…"; sleep 20
          done
          echo "resposta: $body"
          test "$body" = "true"
